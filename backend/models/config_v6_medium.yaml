# PP-OCRv6 medium - 高精度通道（rec-only，small 仍不满意的字段再上这档）
Global:
    text_score: 0.5
    use_det: false
    use_cls: false
    use_rec: true
    print_verbose: false
    min_height: 30
    width_height_ratio: 8
    max_side_len: 2000
    min_side_len: 30
    return_word_box: false

    intra_op_num_threads: &intra_nums -1
    inter_op_num_threads: &inter_nums -1

Det:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    # 占位（本配置 use_det=false 不会用到）
    model_path: D:\Loomy Workspace\ImageCrop\models\onnx\PP-OCRv6\det\PP-OCRv6_det_small.onnx

    limit_side_len: 736
    limit_type: min
    std: [ 0.5, 0.5, 0.5 ]
    mean: [ 0.5, 0.5, 0.5 ]

    thresh: 0.3
    box_thresh: 0.5
    max_candidates: 1000
    unclip_ratio: 1.6
    use_dilation: true
    score_mode: fast

Cls:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    # 占位（本配置 use_cls=false 不会用到，走 rapidocr 包内置 tiny cls）
    model_path: models/ch_ppocr_mobile_v2.0_cls_infer.onnx

    cls_image_shape: [3, 80, 160]
    cls_batch_num: 6
    cls_thresh: 0.9
    label_list: ['0', '180']

Rec:
    intra_op_num_threads: *intra_nums
    inter_op_num_threads: *inter_nums

    use_cuda: false
    use_dml: false

    model_path: D:\Loomy Workspace\ImageCrop\models\onnx\PP-OCRv6\rec\PP-OCRv6_rec_medium.onnx
    rec_keys_path: D:\Loomy Workspace\ImageCrop\models\paddle\PP-OCRv6\rec\PP-OCRv6_rec_medium\ppocrv6_dict.txt

    rec_img_shape: [3, 48, 320]
    rec_batch_num: 6
